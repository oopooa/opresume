<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon：现代浏览器优先使用 SVG（矢量、透明、自动适配明暗主题），
        不支持 SVG 的旧浏览器与外部抓取工具（Slack/RSS 等）回退到 ICO。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#1A1A1A" />
    <title>优派简历</title>
    <!-- 校徽单栏模板 (template7) 依赖：免费可商用中文字体（图标均使用内置 Lucide）。
         index.html(landing) 已有同款链接；编辑器必须单独引入，否则编辑器内
         template7 的中文字体样式不生效。 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/400.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/500.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/700.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/800.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
